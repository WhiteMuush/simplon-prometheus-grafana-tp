# Deployed to /etc/prometheus/prometheus.yml on the Prometheus VM.
# Replace the two placeholders with the values collected in step 5:
#   az monitor data-collection endpoint show --ids "$DCE_ID" --query metricsIngestionEndpoint -o tsv
#   az monitor data-collection rule show --ids "$DCR_ID" --query immutableId -o tsv

global:
  scrape_interval: 30s

scrape_configs:
  - job_name: 'log-analyser-app'
    scheme: https
    static_configs:
      - targets: ['app-monitoring-groupe1.azurewebsites.net']

remote_write:
  - url: "<DCE-METRICS-INGESTION-ENDPOINT>/dataCollectionRules/<DCR-IMMUTABLE-ID>/streams/Microsoft-PrometheusMetrics/api/v1/write?api-version=2023-04-24"
    azuread:
      cloud: 'AzurePublic'
      managed_identity:
        # Empty = system-assigned identity. Requires Prometheus 3.50 or later.
        client_id: ""
