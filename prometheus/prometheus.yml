# Deployed to /etc/prometheus/prometheus.yml on the Prometheus VM.
#
# The two values below come from the Data Collection Endpoint and Rule that
# Azure created on its own alongside the Azure Monitor Workspace:
#   az monitor data-collection endpoint show --ids "$DCE_ID" --query metricsIngestion.endpoint -o tsv
#   az monitor data-collection rule show --ids "$DCR_ID" --query immutableId -o tsv
#
# Note the query path: metricsIngestion.endpoint, not metricsIngestionEndpoint.
# The flat name returns an empty string instead of an error.

global:
  scrape_interval: 30s

scrape_configs:
  - job_name: 'log-analyser-app'
    scheme: https
    static_configs:
      - targets: ['app-monitoring-mpetit.azurewebsites.net']

remote_write:
  - url: "https://amw-monitoring-mpetit-9dt8.francecentral-1.metrics.ingest.monitor.azure.com/dataCollectionRules/dcr-51b7605b3ec048e2801c4958d2fa2452/streams/Microsoft-PrometheusMetrics/api/v1/write?api-version=2023-04-24"
    azuread:
      cloud: 'AzurePublic'
      managed_identity:
        # Empty = the VM's system-assigned identity. Requires Prometheus 3.50+.
        client_id: ""
