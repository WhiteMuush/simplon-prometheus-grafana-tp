name: Terraform

# CI on PRs: fmt / validate / plan (read-only, no state change).
# CD on merge to main: apply, gated by the production environment.
on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"

# id-token: write is what lets the runner mint the OIDC token Azure trusts.
permissions:
  id-token: write
  contents: read

# Shared by both jobs. OIDC + AAD auth, no secret key for the state account.
# Repo secrets are visible to the environment job too, so they live here once.
env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  TF_VAR_alert_email: ${{ secrets.TF_ALERT_EMAIL }}
  TF_VAR_allowed_source_ip: ${{ secrets.TF_ALLOWED_SOURCE_IP }}
  TF_VAR_ssh_public_key_path: ${{ github.workspace }}/ci_id_rsa.pub
  TF_IN_AUTOMATION: "true"

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      # prometheus_vm.tf reads the key from disk at plan time, so write it first.
      - name: Write SSH public key
        run: echo "${{ secrets.PROMETHEUS_SSH_PUBLIC_KEY }}" > "$TF_VAR_ssh_public_key_path"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -input=false -no-color

  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - name: Write SSH public key
        run: echo "${{ secrets.PROMETHEUS_SSH_PUBLIC_KEY }}" > "$TF_VAR_ssh_public_key_path"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Init
        run: terraform init -input=false

      - name: Apply
        run: terraform apply -input=false -auto-approve
